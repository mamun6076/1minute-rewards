<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1Minute Rewards</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09070f;color:#fff;font-family:system-ui,sans-serif}.bar{padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #2b2535}.brand{font-size:21px;font-weight:900}.brand b,.gold{color:#ffbf1f}.wrap{max-width:1050px;margin:auto;padding:45px 6%}.hero{padding:45px 0}.hero h1{font-size:52px;line-height:1.05}.hero h1 span{color:#9b5cff}.card{background:#12101a;border:1px solid #2b2535;border-radius:18px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.btn{background:#7c3cff;border:0;color:#fff;padding:12px 17px;border-radius:10px;font-weight:800}.btn:disabled{opacity:.5}input,select{width:100%;padding:12px;margin:7px 0;background:#0b0910;color:#fff;border:1px solid #3a3046;border-radius:9px}.hidden{display:none}.muted{color:#a69dae}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero h1{font-size:40px}}
</style></head><body>
<header class="bar"><div class="brand"><span class="gold">1</span>Minute <b>REWARDS</b></div><button class="btn" onclick="logout()">Logout</button></header>
<main class="wrap">
<section id="auth" class="card"><h2>Account</h2><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><button class="btn" onclick="register()">Create account</button> <button class="btn" onclick="login()">Login</button><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div class="hero"><p class="gold">WORK • EARN • REWARD</p><h1>স্বাগতম, <span id="userName"></span></h1><p class="muted">আপনার Points: <b id="points">0</b></p></div>
<h2>Available Tasks</h2><div id="tasks" class="grid"></div>
<div class="card"><h2>Withdrawal Request</h2><p class="muted">Demo rule: minimum 100 points.</p><input id="amount" type="number" placeholder="Points"><select id="method"><option>bKash</option><option>Nagad</option></select><input id="account" placeholder="Account number"><button class="btn" onclick="withdraw()">Request Withdrawal</button><p id="wmsg" class="muted"></p></div>
</section></main>
<script>
let tk=localStorage.getItem('1mr_token');
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})};let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function register(){try{let j=await api('/api/register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:pass.value})});tk=j.token;localStorage.setItem('1mr_token',tk);load()}catch(e){msg.textContent=e.message}}
async function login(){try{let j=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});tk=j.token;localStorage.setItem('1mr_token',tk);load()}catch(e){msg.textContent=e.message}}
async function load(){try{let m=await api('/api/me');auth.classList.add('hidden');app.classList.remove('hidden');userName.textContent=m.user.name;points.textContent=m.user.points;let t=await api('/api/tasks');tasks.innerHTML=t.tasks.map(x=>`<div class="card"><h3>${x.title}</h3><p class="muted">${x.description}</p><b class="gold">+${x.reward} points</b><br><br><button class="btn" ${x.completed?'disabled':''} onclick="complete(${x.id})">${x.completed?'Completed':'Start Task'}</button></div>`).join('')}catch(e){localStorage.removeItem('1mr_token');tk=null}}
async function complete(id){try{let j=await api('/api/tasks/'+id+'/complete',{method:'POST'});points.textContent=j.points;load()}catch(e){alert(e.message)}}
async function withdraw(){try{await api('/api/withdrawals',{method:'POST',body:JSON.stringify({amount:Number(amount.value),method:method.value,account:account.value})});wmsg.textContent='Withdrawal request submitted.';load()}catch(e){wmsg.textContent=e.message}}
function logout(){localStorage.removeItem('1mr_token');location.reload()}
if(tk)load()
</script></body></html>
